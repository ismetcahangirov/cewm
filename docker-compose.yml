name: mebline

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mebline
      POSTGRES_PASSWORD: mebline
      POSTGRES_DB: mebline
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mebline -d mebline"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: mebline
      RUSTFS_SECRET_KEY: mebline-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage:/data

  storage-setup:
    image: amazon/aws-cli:2.38.2
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: mebline
      AWS_SECRET_ACCESS_KEY: mebline-secret
      AWS_DEFAULT_REGION: eu-central
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do aws --endpoint-url http://storage:9000 s3 ls >/dev/null 2>&1 && break; sleep 1; done
        aws --endpoint-url http://storage:9000 s3 mb s3://mebline 2>/dev/null || true
        aws --endpoint-url http://storage:9000 s3api put-bucket-cors --bucket mebline --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:3000"],"AllowedMethods":["PUT"],"AllowedHeaders":["content-type"],"MaxAgeSeconds":3600}]}'
        aws --endpoint-url http://storage:9000 s3api put-bucket-policy --bucket mebline --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::mebline/*"}]}'
        echo "bucket mebline ready"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres:
  storage:
